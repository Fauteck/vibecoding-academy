  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-page); color: var(--text-primary); }

    #content { max-width: 800px; margin: 2rem auto; padding: 2rem; background: var(--bg-card-solid); border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); line-height: 1.7; }
    #content h1 { font-size: 1.8rem; margin-bottom: 1rem; color: var(--text-primary); border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem; }
    #content h2 { font-size: 1.4rem; margin-top: 1.8rem; margin-bottom: 0.6rem; color: var(--secondary-color); }
    #content h3 { font-size: 1.15rem; margin-top: 1.4rem; margin-bottom: 0.5rem; color: var(--secondary-color); }
    #content p { margin-bottom: 0.8rem; }
    #content ul, #content ol { margin-bottom: 0.8rem; padding-left: 1.5rem; }
    #content li { margin-bottom: 0.3rem; }
    #content code { background: var(--bg-page); padding: 0.15rem 0.4rem; border-radius: 3px; font-size: 0.9em; font-family: 'Consolas', 'Monaco', monospace; }
    #content pre { background: #1e1e2e; color: #cdd6f4; padding: 1rem; border-radius: 6px; overflow-x: auto; margin-bottom: 1rem; }
    #content pre code { background: none; padding: 0; color: inherit; font-size: 0.85rem; }
    #content strong { color: var(--text-primary); }
    #content table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
    #content th, #content td { border: 1px solid var(--border-color); padding: 0.5rem 0.75rem; text-align: left; }
    #content th { background: var(--bg-page); font-weight: 600; }
    #content hr { border: none; border-top: 1px solid var(--border-color); margin: 1.5rem 0; }
    .loading { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 1.1rem; }
    .error { text-align: center; padding: 3rem; color: var(--danger-color); }
    .idea-nav { max-width: 800px; margin: 1rem auto 2rem; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .idea-nav-top { margin: 2rem auto 0; }
    .idea-nav a { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--primary-color); text-decoration: none; font-size: 0.9rem; padding: 0.4rem 0.8rem; border-radius: var(--border-radius-button); border: 1px solid var(--border-color); transition: background var(--transition-fast); }
    .idea-nav a:hover { background: var(--bg-page); }
    .idea-nav .disabled { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.9rem;
                          padding: 0.4rem 0.8rem; border-radius: var(--border-radius-button);
                          border: 1px solid var(--border-color); color: var(--text-muted); opacity: 0.3; }
    .idea-nav .counter { color: var(--text-muted); font-size: 0.8rem; }
    @media (max-width: 600px) {
      #content { margin: 1rem; padding: 1.2rem; }
      .idea-nav { padding: 0 1rem; }
    }

  </style>
</head>
<body>
  <nav id="site-nav"></nav>
  <main id="main">
  <nav id="idea-nav-top" class="idea-nav idea-nav-top" style="display:none;"></nav>
  <div id="content"><div class="loading">Laden...</div></div>
  <nav id="idea-nav" class="idea-nav" style="display:none;"></nav>
  <script src="../vendor/marked/marked.min.js" defer></script>
  <script src="../vendor/dompurify/purify.min.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var ideas = [
        { file: 'flappybird.md', title: 'Flappy Bird', emoji: '\uD83D\uDC26' },
        { file: 'memory.md', title: 'Memory', emoji: '\uD83C\uDCCF' },
        { file: 'minesweeper.md', title: 'Minesweeper', emoji: '\uD83D\uDCA3' },
        { file: 'pong.md', title: 'Pong', emoji: '\uD83C\uDFD3' },
        { file: 'snake.md', title: 'Snake', emoji: '\uD83D\uDC0D' },
        { file: 'solitaire.md', title: 'Solitär', emoji: '\uD83C\uDCA1' },
        { file: 'sudoku.md', title: 'Sudoku', emoji: '\uD83D\uDD22' },
        { file: 'tetris.md', title: 'Tetris', emoji: '\uD83E\uDDF1' },
        { file: 'tictactoe.md', title: 'Tic-Tac-Toe', emoji: '\u274C' }
      ];

      var params = new URLSearchParams(window.location.search);
      var file = params.get('file');
      var el = document.getElementById('content');

      var allowedFiles = ideas.map(function (i) { return i.file; });
      if (!file || allowedFiles.indexOf(file) === -1) {
        el.textContent = 'Ungültige oder fehlende Datei.';
        return;
      }

      // Build prev/next navigation
      var idx = ideas.findIndex(function(i) { return i.file === file; });
      if (idx !== -1) {
        var nav = document.getElementById('idea-nav');
        var navTop = document.getElementById('idea-nav-top');
        var prev = idx > 0 ? ideas[idx - 1] : null;
        var next = idx < ideas.length - 1 ? ideas[idx + 1] : null;

        var html = '';
        if (prev) {
          html += '<a href="viewer.html?file=' + prev.file + '">\u2190 ' + prev.emoji + ' ' + prev.title + '</a>';
        } else {
          html += '<span class="disabled">\u2190 Vorherige</span>';
        }
        html += '<span class="counter">' + (idx + 1) + ' / ' + ideas.length + '</span>';
        if (next) {
          html += '<a href="viewer.html?file=' + next.file + '">' + next.emoji + ' ' + next.title + ' \u2192</a>';
        } else {
          html += '<span class="disabled">Nächste \u2192</span>';
        }
        nav.innerHTML = html;
        nav.style.display = 'flex';
        navTop.innerHTML = html;
        navTop.style.display = 'flex';
      }

      fetch(file)
        .then(function(res) {
          if (!res.ok) throw new Error('Nicht gefunden');
          return res.text();
        })
        .then(function(text) {
          el.innerHTML = DOMPurify.sanitize(marked.parse(text));
          var h1 = el.querySelector('h1');
          if (h1) document.title = h1.textContent + ' - Vibecoding Academy';
        })
        .catch(function() {
          el.innerHTML = '<div class="error">Die Datei konnte nicht geladen werden.</div>';
        });
    });
  </script>
  <!-- Bootstrap JS Bundle -->
  <script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/components.js"></script>
</body>
